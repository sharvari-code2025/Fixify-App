{% extends "base.html" %}

{% block title %}Set New Password — Fixify{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding: 3.5rem 1.25rem;">
    <div class="card" style="padding: 2.25rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 0.75rem;">🔒</div>
            <h2 style="margin-bottom: 0.25rem;">Set New Password</h2>
            <p style="font-size: 0.9rem;">Choose a strong, unique password for your account</p>
        </div>

        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required minlength="8" autofocus>
                    <button type="button" class="input-toggle-btn password-toggle-btn" data-target="new_password">Show</button>
                </div>
                <span class="input-help">At least 8 characters with uppercase, lowercase, and numeric digits.</span>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="8">
                    <button type="button" class="input-toggle-btn password-toggle-btn" data-target="confirm_password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
