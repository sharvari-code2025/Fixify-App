{% extends "base.html" %}
{% block title %}404 Not Found — Fixify{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding: 5rem 1.25rem; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
        <h2 style="margin-bottom: 0.5rem;">404 — Page Not Found</h2>
        <p>The page or repair reference you are looking for does not exist or has been relocated.</p>
        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center;">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
            <a href="{{ url_for('bookings.track') }}" class="btn btn-secondary">Track a Repair</a>
        </div>
    </div>
</div>
{% endblock %}
