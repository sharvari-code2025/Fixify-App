{% extends "base.html" %}
{% block title %}400 Bad Request — Fixify{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; padding: 5rem 1.25rem; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
        <h2 style="margin-bottom: 0.5rem;">400 — Bad Request</h2>
        <p>{{ description or 'The request could not be processed due to invalid parameters or an expired CSRF token.' }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary" style="margin-top: 1rem;">Return to Homepage</a>
    </div>
</div>
{% endblock %}
